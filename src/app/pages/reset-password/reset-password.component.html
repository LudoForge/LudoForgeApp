<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0">
        <div class="card-header bg-dark text-white text-center py-3">
          <h4 class="mb-0">Reset Password</h4>
        </div>
        <div class="card-body p-4">
          <p class="text-muted small mb-4">
            Inserisci la tua nuova password. Assicurati che sia sicura.
          </p>

          <div class="mb-3">
            <label class="form-label">Nuova Password</label>
            <input type="password" class="form-control" [(ngModel)]="newPassword" placeholder="Almeno 8 caratteri">
          </div>

          <div class="mb-4">
            <label class="form-label">Conferma Password</label>
            <input type="password" class="form-control" [(ngModel)]="confirmPassword" placeholder="Ripeti la password">
          </div>

          <button 
            (click)="confirmReset()" 
            [disabled]="!newPassword || newPassword !== confirmPassword" 
            class="btn btn-primary w-100 py-2">
            Salva nuova password
          </button>

          @if (newPassword && confirmPassword && newPassword !== confirmPassword) {
            <div class="text-danger small mt-2 text-center">Le password non coincidono</div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
